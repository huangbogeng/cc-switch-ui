name: Release

on:
  push:
    tags:
      - 'v*.*.*' # Trigger when pushing tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: cc-switch-web
            asset_name: cc-switch-web-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: cc-switch-web
            asset_name: cc-switch-web-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: cc-switch-web
            asset_name: cc-switch-web-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: cc-switch-web.exe
            asset_name: cc-switch-web-windows-x86_64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Frontend
        working-directory: ./cc-switch-ui
        run: |
          pnpm install
          pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust Target (Fallback)
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Backend (Rust)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Release Asset
        shell: bash
        run: |
          mkdir -p release_assets/cc-switch-web/dist
          
          # 复制前端 dist 和后端二进制文件到临时目录
          cp -r cc-switch-ui/dist/* release_assets/cc-switch-web/dist/
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release_assets/cc-switch-web/
          
          cd release_assets
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows 打包为 zip
            7z a ../${{ matrix.asset_name }}.zip cc-switch-web
            echo "ASSET_FILE=${{ matrix.asset_name }}.zip" >> $GITHUB_ENV
          else
            # Linux 和 macOS 打包为 tar.gz
            tar -czf ../${{ matrix.asset_name }}.tar.gz cc-switch-web
            echo "ASSET_FILE=${{ matrix.asset_name }}.tar.gz" >> $GITHUB_ENV
          fi
          cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_FILE }}
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
