name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-darwin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
          - platform: darwin-x64
            target: x86_64-apple-darwin
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: cc-switch-ui/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Build frontend
        run: |
          cd cc-switch-ui
          pnpm install
          pnpm build

      - name: Build backend
        run: |
          cargo build --release --bin cc-switch-web --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p release
          tar -czf "release/cc-switch-web-${{ matrix.platform }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" cc-switch-web \
            -C "../../cc-switch-ui" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-web-${{ matrix.platform }}
          path: release/cc-switch-web-${{ matrix.platform }}.tar.gz

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: cc-switch-ui/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Build frontend
        run: |
          cd cc-switch-ui
          pnpm install
          pnpm build

      - name: Build backend
        run: |
          cargo build --release --bin cc-switch-web

      - name: Package
        run: |
          mkdir -p release
          tar -czf "release/cc-switch-web-linux-x64.tar.gz" \
            -C "target/release" cc-switch-web \
            -C "cc-switch-ui" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-web-linux-x64
          path: release/cc-switch-web-linux-x64.tar.gz

  create-release:
    needs: [build-darwin, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cc-switch-web-darwin-arm64/cc-switch-web-darwin-arm64.tar.gz
            artifacts/cc-switch-web-darwin-x64/cc-switch-web-darwin-x64.tar.gz
            artifacts/cc-switch-web-linux-x64/cc-switch-web-linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}