name: Release

on:
  push:
    tags:
      - 'v*.*.*' # Trigger when pushing tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: cc-switch-ui
            asset_name: cc-switch-ui-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: cc-switch-ui
            asset_name: cc-switch-ui-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: cc-switch-ui
            asset_name: cc-switch-ui-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: cc-switch-ui.exe
            asset_name: cc-switch-ui-windows-x86_64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cc-switch-ui/package-lock.json

      - name: Build Frontend
        working-directory: ./cc-switch-ui
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (Rust)
        run: cargo build --release --package cc-switch-cli --target ${{ matrix.target }}

      - name: Verify Linux Static Binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ldd_output="$(ldd target/${{ matrix.target }}/release/${{ matrix.binary_name }} 2>&1)"
          echo "$ldd_output"
          if echo "$ldd_output" | grep -Eq "not a dynamic executable|statically linked"; then
            echo "Linux binary is static"
          else
            exit 1
          fi

      - name: Prepare Release Asset
        shell: bash
        run: |
          mkdir -p release_assets/cc-switch-ui/dist
          
          # 复制前端 dist 和 CLI 二进制文件到临时目录
          cp -r cc-switch-ui/dist/* release_assets/cc-switch-ui/dist/
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release_assets/cc-switch-ui/
          
          cd release_assets
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows 打包为 zip
            7z a ../${{ matrix.asset_name }}.zip cc-switch-ui
            echo "ASSET_FILE=${{ matrix.asset_name }}.zip" >> $GITHUB_ENV
          else
            # Linux 和 macOS 打包为 tar.gz
            tar -czf ../${{ matrix.asset_name }}.tar.gz cc-switch-ui
            echo "ASSET_FILE=${{ matrix.asset_name }}.tar.gz" >> $GITHUB_ENV
          fi
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ env.ASSET_FILE }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cc-switch-ui-*
          path: release_assets
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
